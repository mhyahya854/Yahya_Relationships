name: Build & Package Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_triple: x86_64-pc-windows-msvc
            artifact_name: People-Relationships-Windows-x64
          - os: macos-14
            target_triple: aarch64-apple-darwin
            artifact_name: People-Relationships-macOS-arm64
          - os: macos-15-intel
            target_triple: x86_64-apple-darwin
            artifact_name: People-Relationships-macOS-x64
          - os: ubuntu-latest
            target_triple: x86_64-unknown-linux-gnu
            artifact_name: People-Relationships-Linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Public source privacy gate
        env:
          MOSAIC_PRIVACY_HMAC_KEY: ${{ secrets.MOSAIC_PRIVACY_HMAC_KEY }}
        run: python Scripts/privacy_gate.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (WebKitGTK & build tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            build-essential \
            curl \
            wget \
            file

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest httpx
          pip install -e App

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix App/Frontend

      - name: Run Backend Pytest Suite
        run: |
          pytest Tests/Backend -v

      - name: Run Synthetic Kinship & Perspective Audit
        run: |
          python Scripts/check_family_synthetic.py

      - name: Run Frontend Typecheck & Build
        run: |
          npm --prefix App/Frontend run typecheck
          npm --prefix App/Frontend run build

      - name: Build Native Python Backend Sidecar
        env:
          MOSAIC_PRIVACY_HMAC_KEY: ${{ secrets.MOSAIC_PRIVACY_HMAC_KEY }}
        run: |
          python Scripts/privacy_gate.py
          python Packaging/Scripts/build_backend.py --triple ${{ matrix.target_triple }}

      - name: Verify Expected Backend Sidecar Exists
        shell: bash
        run: |
          TRIPLE="${{ matrix.target_triple }}"
          if [[ "$TRIPLE" == *"windows"* ]]; then
            EXE_NAME="people-relationships-backend-${TRIPLE}.exe"
          else
            EXE_NAME="people-relationships-backend-${TRIPLE}"
          fi
          EXPECTED_PATH="Desktop/Tauri/binaries/${EXE_NAME}"
          if [ ! -f "$EXPECTED_PATH" ]; then
            echo "::error::Expected backend sidecar binary does not exist at: $EXPECTED_PATH"
            exit 1
          fi
          echo "Verified sidecar binary exists at: $EXPECTED_PATH ($(wc -c < "$EXPECTED_PATH") bytes)"

      - name: Cargo Check (Desktop Tauri)
        run: |
          cargo check --manifest-path Desktop/Tauri/Cargo.toml

      - name: Package Desktop Application
        env:
          MOSAIC_PRIVACY_HMAC_KEY: ${{ secrets.MOSAIC_PRIVACY_HMAC_KEY }}
        run: |
          node Packaging/Scripts/package.mjs --skip-sidecar

      - name: Mandatory Privacy & Security Audit
        env:
          MOSAIC_PRIVACY_HMAC_KEY: ${{ secrets.MOSAIC_PRIVACY_HMAC_KEY }}
        run: |
          python Packaging/Scripts/audit_package.py Desktop/Tauri/target/release/bundle

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            Packaging/release/
            Desktop/Tauri/target/release/bundle/
          if-no-files-found: error
